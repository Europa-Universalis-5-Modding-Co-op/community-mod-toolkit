name: Create Toolkit Release

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 1.0.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A PAT with Contents and Workflows write access, since GITHUB_TOKEN
          # cannot push a branch carrying .github/workflows/cmt-create-release.yml.
          token: ${{ secrets.CMT_RELEASE_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version and branch
        id: config
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BRANCH="toolkit-release-dev"
            SOURCE="dev"

            # Get latest version from both release branches, use the higher one
            DEV_VER="0.0.0"
            REL_VER="0.0.0"
            if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
              DEV_VER=$(git log -1 --format=%s "origin/$BRANCH" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "0.0.0")
            fi
            if git show-ref --verify --quiet "refs/remotes/origin/toolkit-release"; then
              REL_VER=$(git log -1 --format=%s "origin/toolkit-release" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "0.0.0")
            fi

            # Compare and take the higher version
            IFS='.' read -r D_MAJ D_MIN D_PAT <<< "$DEV_VER"
            IFS='.' read -r R_MAJ R_MIN R_PAT <<< "$REL_VER"
            if [ "$R_MAJ" -gt "$D_MAJ" ] || \
               { [ "$R_MAJ" -eq "$D_MAJ" ] && [ "$R_MIN" -gt "$D_MIN" ]; } || \
               { [ "$R_MAJ" -eq "$D_MAJ" ] && [ "$R_MIN" -eq "$D_MIN" ] && [ "$R_PAT" -gt "$D_PAT" ]; }; then
              MAJOR=$R_MAJ; MINOR=$R_MIN; PATCH=$R_PAT
            else
              MAJOR=$D_MAJ; MINOR=$D_MIN; PATCH=$D_PAT
            fi
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          else
            BRANCH="toolkit-release"
            SOURCE="main"
            VERSION="${{ inputs.version }}"
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update release branch
        run: |
          BRANCH="${{ steps.config.outputs.branch }}"
          SOURCE="${{ steps.config.outputs.source }}"
          VERSION="${{ steps.config.outputs.version }}"

          # Switch to release branch (create orphan if it doesn't exist)
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout "$BRANCH"
          else
            git checkout --orphan "$BRANCH"
          fi

          # Wipe current directory
          git rm -rf .

          # Overwrite with source branch
          git checkout "$SOURCE" -- .

          # Remove toolkit-only files, keeping the release workflow mods use
          git rm -f README.md
          git rm -rf docs/
          git rm -f assets/images/mod-id-location.png
          git rm -f .github/workflows/_cmt-create-release.yml
          git mv -f README-TEMPLATE.md README.md

          # Reset Workshop item IDs
          config_path="tools/config.toml"
          reset_item_id() {
            awk -v key="$1" '
            BEGIN { updated = 0; pattern = "^[[:space:]]*" key "[[:space:]]*=" }
            $0 ~ pattern {
              match($0, pattern "[[:space:]]*")
              prefix = substr($0, RSTART, RLENGTH)
              rest = substr($0, RSTART + RLENGTH)
              sub(/^[^#[:space:]]+/, "", rest)
              print prefix "0" rest
              updated = 1
              next
            }
            { print }
            END {
              if (!updated) {
                print key " = 0"
              }
            }
            ' "$config_path" > "${config_path}.tmp"
            mv "${config_path}.tmp" "$config_path"
          }
          reset_item_id workshop_upload_item_id
          reset_item_id workshop_upload_item_id_dev
          git add "$config_path"

          # Commit and push
          git commit -m "v${VERSION}"
          git push origin "$BRANCH"

      - name: Create GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.config.outputs.version }}"
          cp tools/setup.py setup.py
          gh release create "v${VERSION}" \
            "setup.py" \
            --title "v${VERSION}" \
            --target toolkit-release \
            --generate-notes
