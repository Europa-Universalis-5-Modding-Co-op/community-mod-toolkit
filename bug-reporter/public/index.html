<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Report a Bug</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>Report a Bug</h1>
      <p class="intro">
        Found a problem with the mod? Tell us what happened and attach your save
        so the bug can be reproduced. A save is required.
      </p>

      <div id="status" class="status" hidden></div>

      <form id="report-form" novalidate hidden>
        <div class="mod-badge">
          <span class="badge-label">Mod</span>
          <span id="mod-name" class="badge-value"></span>
        </div>

        <label>
          Short summary
          <input type="text" name="title" maxlength="200" required
                 placeholder="One line: what is wrong" />
        </label>

        <label>
          Steps to reproduce
          <textarea name="steps" rows="4" maxlength="5000" required
                    placeholder="What were you doing when it happened?"></textarea>
        </label>

        <div class="row">
          <label>
            What you expected
            <textarea name="expected" rows="2" maxlength="2000" required></textarea>
          </label>
          <label>
            What actually happened
            <textarea name="actual" rows="2" maxlength="2000" required></textarea>
          </label>
        </div>

        <div class="row">
          <label>
            EU5 version
            <input type="text" name="eu5_version" maxlength="60" required placeholder="e.g. 1.3.2" />
          </label>
          <label>
            Mod version
            <input type="text" name="mod_version" maxlength="60" required placeholder="e.g. 2.1.0" />
          </label>
        </div>

        <label>
          Other mods loaded
          <textarea name="other_mods" rows="2" maxlength="4000" required
                    placeholder="List the other mods you had on, or write &quot;none&quot;"></textarea>
        </label>

        <label>
          Contact handle <span class="optional">(optional)</span>
          <input type="text" name="contact" maxlength="200"
                 placeholder="Discord or Steam handle" />
          <span class="hint">Reports are anonymous. Without a handle there is no way to reach you for more detail.</span>
        </label>

        <div class="file-field">
          <span class="field-label">Save file <span class="req">required, max <span id="max-size"></span></span></span>
          <div id="drop-zone" class="drop-zone" tabindex="0" role="button"
               aria-label="Choose or drop your .eu5 save file">
            <p class="drop-hint">Drop your <strong>.eu5</strong> save here, or click to choose</p>
            <p id="file-name" class="file-name" hidden></p>
          </div>
          <input id="file-input" type="file" accept=".eu5" hidden />
          <span id="file-error" class="error" role="alert"></span>
          <span class="hint">Saves can be large, so the upload may take a while on a slow connection.</span>
        </div>

        <div id="turnstile" class="turnstile"></div>

        <div id="progress-wrap" class="progress-wrap" hidden>
          <span id="progress-label" class="progress-label"></span>
          <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
          <span id="progress-text" class="progress-text"></span>
        </div>

        <button id="submit-btn" type="submit">Submit report</button>

        <div id="result" class="result" hidden></div>
      </form>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
